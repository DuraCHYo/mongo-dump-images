name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: MongoDB ${{ matrix.mongo }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mongo: ["7.x", "8.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},prefix=${{ matrix.mongo }}-
            type=raw,value=${{ matrix.mongo }}
            type=raw,value=latest,enable=${{ matrix.mongo == '8.x' }}
          labels: |
            org.opencontainers.image.title=mongo-dump-images
            org.opencontainers.image.description=MongoDB ${{ matrix.mongo }} mongodump backup image

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.mongo }}
          file: ./${{ matrix.mongo }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.mongo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mongo }}
